<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forth Graph</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808; color: #bbb;
      font-family: 'Courier New', monospace;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    /* ── Control bar ─────────────────────────────────────────────── */
    #bar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 9px 16px;
      border-bottom: 1px solid #0e0e0e;
      background: #060606;
    }
    #bar h1 { font-size: 10px; letter-spacing: 5px; color: #242424; font-weight: normal; }
    button {
      background: transparent; color: #363636;
      border: 1px solid #1c1c1c; padding: 5px 12px;
      font-family: inherit; font-size: 9px; letter-spacing: 2px;
      cursor: pointer; text-transform: uppercase;
      transition: color 0.1s, border-color 0.1s;
    }
    button:hover:not(:disabled) { color: #aaa; border-color: #444; }
    button:disabled { opacity: 0.1; cursor: default; }
    #breed-btn:not(:disabled) { color: #ff6b35; border-color: #ff6b35; }
    #gen-btn { color: #2a4a6a; border-color: #1a2a3a; }
    #gen-btn:hover { color: #35bfff !important; border-color: #35bfff !important; }
    #anim-btn:not(:disabled) { color: #28c828; border-color: #28c828; }
    #status { font-size: 8px; color: #1c1c1c; letter-spacing: 2px; margin-left: auto; }

    /* ── Scrollable workspace ────────────────────────────────────── */
    #workspace {
      flex: 1; overflow: scroll;
      position: relative;
      background:
        radial-gradient(circle, #0f0f0f 1px, transparent 1px) 0 0 / 24px 24px;
    }
    #workspace-inner {
      position: relative; width: 4000px; height: 3000px;
    }

    /* ── SVG edge layer ──────────────────────────────────────────── */
    #edges {
      position: absolute; top: 0; left: 0;
      width: 4000px; height: 3000px;
      pointer-events: none; overflow: visible;
    }

    /* ── Nodes ───────────────────────────────────────────────────── */
    .node {
      position: absolute;
      width: 148px;
      background: #0c0c0c;
      border: 1.5px solid #161616;
      cursor: grab;
      user-select: none;
      transition: border-color 0.1s;
    }
    .node:active { cursor: grabbing; }
    .node:hover { border-color: #262626; }
    .node.p1 { border-color: #ff6b35; }
    .node.p2 { border-color: #35bfff; }
    .node.generated { border-color: #1a2a3a; }
    .node.generated:hover { border-color: #2a4a6a; }
    .node.anim { border-color: #1a3a1a; animation: anim-pulse 1.8s ease-in-out infinite; }
    .node.anim:hover { border-color: #3a6a3a; }

    @keyframes anim-pulse {
      0%, 100% { border-color: #1a3a1a; box-shadow: 0 0 0 0 transparent; }
      50%       { border-color: #28c828; box-shadow: 0 0 7px 1px #28c82840; }
    }

    .node-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 6px 3px;
      font-size: 7.5px; letter-spacing: 1px;
      border-bottom: 1px solid #0f0f0f;
      color: #1c1c1c;
      line-height: 1;
    }
    .node.p1 .node-header { color: #4a2010; border-bottom-color: #180a04; }
    .node.p2 .node-header { color: #103040; border-bottom-color: #040e14; }
    .node.generated .node-header { color: #102030; }
    .node.anim .node-header { color: #0e2a0e; border-bottom-color: #061006; }

    .node-tag { letter-spacing: 1px; }
    .node.p1 .node-tag { color: #ff6b35; }
    .node.p2 .node-tag { color: #35bfff; }
    .node.anim .node-code { color: #0c2210; }
    .node.anim .node-tag { color: #28c828; }

    .node canvas { display: block; width: 144px; height: 144px; margin: 2px; }

    .node-code {
      font-size: 6.5px; color: #141414; line-height: 1.5;
      padding: 4px; word-break: break-all; white-space: pre-wrap;
      max-height: 58px; overflow-y: auto;
      border-top: 1px solid #0e0e0e; background: #060606;
      scrollbar-width: none;
    }
    .node.p1 .node-code { color: #361208; }
    .node.p2 .node-code { color: #08182a; }
    .node.generated .node-code { color: #0c1c2a; }
  </style>
</head>
<body>

<div id="bar">
  <h1>FORTH GRAPH</h1>
  <button id="breed-btn" disabled>BREED</button>
  <button id="anim-btn" disabled>ANIMATE</button>
  <button id="gen-btn">GENERATE ×3</button>
  <button id="reset-btn">RESET</button>
  <span id="status">click to select · delete key removes selected</span>
</div>

<div id="workspace">
  <div id="workspace-inner">
    <svg id="edges"></svg>
    <div id="node-layer"></div>
  </div>
</div>

<script>
// ─── Tokenizer ────────────────────────────────────────────────────────────────
// Converts a Forth source string into a flat token array.
// Three token kinds:
//   {t:'n', v:42}            — numeric literal
//   {t:'w', v:'circle'}      — word / command
//   {t:'block', v:[tokens]}  — { ... } quoted block (used by `times`)
// Nested blocks are parsed recursively by tracking brace depth.

function tokenize(src) {
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    while (i < src.length && /\s/.test(src[i])) i++;
    if (i >= src.length) break;
    if (src[i] === '{') {
      let depth = 1, j = i + 1;
      while (j < src.length && depth > 0) {
        if (src[j] === '{') depth++;
        else if (src[j] === '}') depth--;
        j++;
      }
      tokens.push({ t: 'block', v: tokenize(src.slice(i + 1, j - 1)) });
      i = j;
    } else if (src[i] === '}') {
      i++;
    } else {
      let j = i;
      while (j < src.length && !/[\s{}]/.test(src[j])) j++;
      const word = src.slice(i, j);
      if (word) {
        const n = +word;
        tokens.push(isNaN(n) ? { t: 'w', v: word } : { t: 'n', v: n });
      }
      i = j;
    }
  }
  return tokens;
}

// ─── Interpreter ──────────────────────────────────────────────────────────────
// Stack-based executor. Each call gets its own stack `st`; no global state.
//
// Drawing stack conventions (args are popped right-to-left):
//   circle    — x y r
//   line      — x1 y1 x2 y2
//   hsl       — h s l        (sets both fillStyle and strokeStyle)
//   bg-a      — r g b a      (fills whole canvas with alpha, used for trail fade)
//
// Loop: n times { ... }
//   `times` pops `n` from the stack, then reads the NEXT token in the stream
//   (which must be a block) rather than popping a block from the stack.
//   This matches Forth source order and avoids the block token ever landing on
//   the stack, which would break crossover.
//
// `lv` is the loop-variable stack: `i` pushes lv[last], `j` pushes lv[last-1].
// Each nested `times` call appends the current iteration index to lv.

function run(toks, ctx, W, H, fr, lv) {
  if (!lv) lv = [];
  const st = [];
  const pu = v => st.push(v);
  const po = () => st.length ? st.pop() : 0;

  for (let ip = 0; ip < toks.length; ip++) {
    const tk = toks[ip];
    if (tk.t === 'n') { pu(tk.v); continue; }
    if (tk.t === 'block') { pu(tk); continue; }
    const w = tk.v;
    switch (w) {
      case 'pi':     pu(Math.PI); break;
      case 'twopi':  pu(Math.PI * 2); break;
      case 'frame':  pu(fr); break;
      case 'width':  pu(W); break;
      case 'height': pu(H); break;
      case 'cx':     pu(W / 2); break;
      case 'cy':     pu(H / 2); break;
      case 'rand':   pu(Math.random()); break;
      case 'i':      pu(lv.length ? lv[lv.length - 1] : 0); break;
      case 'j':      pu(lv.length >= 2 ? lv[lv.length - 2] : 0); break;
      case 'dup':  { const a = po(); pu(a); pu(a); break; }
      case 'drop': po(); break;
      case 'swap': { const b = po(), a = po(); pu(b); pu(a); break; }
      case 'over': { const b = po(), a = po(); pu(a); pu(b); pu(a); break; }
      case 'rot':  { const c = po(), b = po(), a = po(); pu(b); pu(c); pu(a); break; }
      case '2dup': { const b = po(), a = po(); pu(a); pu(b); pu(a); pu(b); break; }
      case '+':    pu(po() + po()); break;
      case '-':    { const b = po(), a = po(); pu(a - b); break; }
      case '*':    pu(po() * po()); break;
      case '/':    { const b = po(), a = po(); pu(b ? a / b : 0); break; }
      case 'mod':  { const b = po(), a = po(); pu(b ? ((a % b) + b) % b : 0); break; }
      case 'abs':   pu(Math.abs(po())); break;
      case 'neg':   pu(-po()); break;
      case 'floor': pu(Math.floor(po())); break;
      case 'ceil':  pu(Math.ceil(po())); break;
      case 'round': pu(Math.round(po())); break;
      case 'sqrt':  pu(Math.sqrt(Math.abs(po()))); break;
      case 'sin':   pu(Math.sin(po())); break;
      case 'cos':   pu(Math.cos(po())); break;
      case 'tan':   pu(Math.tan(po())); break;
      case 'pow':   { const b = po(), a = po(); pu(Math.pow(Math.abs(a), b)); break; }
      case 'min':   pu(Math.min(po(), po())); break;
      case 'max':   pu(Math.max(po(), po())); break;
      case 'clamp': { const hi = po(), lo = po(), v = po(); pu(Math.max(lo, Math.min(hi, v))); break; }
      case 'rgb': {
        const b = po(), g = po(), r = po();
        ctx.fillStyle = ctx.strokeStyle = `rgb(${r|0},${g|0},${b|0})`; break;
      }
      case 'rgba': {
        const a = po(), b = po(), g = po(), r = po();
        ctx.fillStyle = ctx.strokeStyle = `rgba(${r|0},${g|0},${b|0},${a})`; break;
      }
      case 'hsl': {
        const l = po(), s = po(), h = po();
        ctx.fillStyle = ctx.strokeStyle = `hsl(${h|0},${s|0}%,${l|0}%)`; break;
      }
      case 'hsla': {
        const a = po(), l = po(), s = po(), h = po();
        ctx.fillStyle = ctx.strokeStyle = `hsla(${h|0},${s|0}%,${l|0}%,${a})`; break;
      }
      case 'alpha': ctx.globalAlpha = Math.max(0, Math.min(1, po())); break;
      case 'bg': case 'background': {
        const b = po(), g = po(), r = po(), pa = ctx.globalAlpha;
        ctx.globalAlpha = 1; ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
        ctx.fillRect(0, 0, W, H); ctx.globalAlpha = pa; break;
      }
      case 'bg-a': case 'background-a': {
        const a = po(), b = po(), g = po(), r = po(), pa = ctx.globalAlpha;
        ctx.globalAlpha = Math.max(0, Math.min(1, a));
        ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
        ctx.fillRect(0, 0, W, H); ctx.globalAlpha = pa; break;
      }
      case 'clear': ctx.clearRect(0, 0, W, H); break;
      case 'lw': case 'linewidth': ctx.lineWidth = Math.max(0.1, po()); break;
      case 'circle': {
        const r = po(), y = po(), x = po();
        if (r > 0) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); } break;
      }
      case 'ocircle': case 'stroke-circle': {
        const r = po(), y = po(), x = po();
        if (r > 0) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); } break;
      }
      case 'rect': {
        const h = po(), ww = po(), y = po(), x = po(); ctx.fillRect(x, y, ww, h); break;
      }
      case 'orect': case 'stroke-rect': {
        const h = po(), ww = po(), y = po(), x = po(); ctx.strokeRect(x, y, ww, h); break;
      }
      case 'line': {
        const y2 = po(), x2 = po(), y1 = po(), x1 = po();
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); break;
      }
      case 'triangle': {
        const y3 = po(), x3 = po(), y2 = po(), x2 = po(), y1 = po(), x1 = po();
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
        ctx.closePath(); ctx.fill(); break;
      }
      case 'translate': { const y = po(), x = po(); ctx.translate(x, y); break; }
      case 'scale':     { const y = po(), x = po(); ctx.scale(x, y); break; }
      case 'rotate':    ctx.rotate(po()); break;
      case 'push': case 'save':    ctx.save(); break;
      case 'pop':  case 'restore': ctx.restore(); break;
      // n times { ... } — block is the next token in the stream
      case 'times': {
        const n = po(), next = toks[ip + 1];
        if (next && next.t === 'block') {
          ip++;
          const cnt = Math.max(0, Math.min(500, n | 0));
          for (let ii = 0; ii < cnt; ii++) run(next.v, ctx, W, H, fr, [...lv, ii]);
        }
        break;
      }
      case 'call': {
        const blk = po();
        if (blk && blk.t === 'block') run(blk.v, ctx, W, H, fr, lv);
        break;
      }
      default: break;
    }
  }
}

// ─── Serialization ────────────────────────────────────────────────────────────
// Converts a token array back to a human-readable Forth string.
// Displayed in the node-code panel under each canvas so you can read the
// program that produced a given visual.

function toksToStr(toks) {
  return toks.map(t => {
    if (t.t === 'n') return String(Math.round(t.v * 1000) / 1000);
    if (t.t === 'w') return t.v;
    return '{ ' + toksToStr(t.v) + ' }';
  }).join(' ');
}

// ─── Crossover ────────────────────────────────────────────────────────────────
// Splices two token arrays together at random cut points to produce one child.
//
// Problem: a flat crossover could cut between `times` and its `{ block }`,
// producing a structurally broken program. Solution:
//   compress   — folds each `n times { block }` triplet into one loop atom
//   crossover  — cuts only at atom boundaries (safe splice point)
//   decompress — unpacks loop atoms back into three tokens
//
// This means loops are always inherited whole from one parent or the other.

function compress(toks) {
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    if (toks[i].t === 'n' &&
        i + 1 < toks.length && toks[i+1].t === 'w' && toks[i+1].v === 'times' &&
        i + 2 < toks.length && toks[i+2].t === 'block') {
      out.push({ t: 'loop', n: toks[i].v, body: toks[i+2].v });
      i += 2;
    } else {
      out.push(toks[i]);
    }
  }
  return out;
}

function decompress(atoms) {
  return atoms.flatMap(a =>
    a.t === 'loop'
      ? [{ t: 'n', v: a.n }, { t: 'w', v: 'times' }, { t: 'block', v: a.body }]
      : [a]
  );
}

function crossover(a, b) {
  const aa = compress(a), bb = compress(b);
  if (!aa.length) return JSON.parse(JSON.stringify(b));
  if (!bb.length) return JSON.parse(JSON.stringify(a));
  const ca = 1 + Math.floor(Math.random() * aa.length);
  const cb = Math.floor(Math.random() * bb.length);
  return decompress([...aa.slice(0, ca), ...bb.slice(cb)]);
}

// ─── Mutation ─────────────────────────────────────────────────────────────────
// Applies one random mutation to a deep-cloned token tree.
// Only numeric tokens are touched — structural words (times, circle, hsl, etc.)
// are never removed or replaced, so the program always stays executable.
//
// Five strategies (chosen by a random roll):
//   30% — small tweak:    ±20% scale + jitter on 1–2 numbers
//   20% — negate:         flip sign (mirrors spirals, inverts orbits)
//   15% — swap:           exchange two numbers (shifts proportions/timings)
//   15% — wild replace:   random value ±360 (good for hues and angles)
//   20% — large jitter:   big additive ±60 shift (breaks symmetry dramatically)

function mutate(toks) {
  const t = JSON.parse(JSON.stringify(toks));
  const refs = [];
  function collect(arr) {
    arr.forEach((tk, i) => {
      if (tk.t === 'n') refs.push({ arr, i });
      if (tk.t === 'block') collect(tk.v);
    });
  }
  collect(t);
  if (!refs.length) return t;

  const r = Math.random();
  if (r < 0.30) {
    // Small tweak: ±20% scale + small jitter (1–2 numbers)
    const count = Math.random() < 0.35 ? 2 : 1;
    for (let c = 0; c < count; c++) {
      const { arr, i } = refs[Math.floor(Math.random() * refs.length)];
      arr[i] = { t: 'n', v: arr[i].v * (0.7 + Math.random() * 0.6) + (Math.random() - 0.5) * 15 };
    }
  } else if (r < 0.50) {
    // Negate: flips sign — mirrors spirals, inverts orbits, reverses waves
    const { arr, i } = refs[Math.floor(Math.random() * refs.length)];
    arr[i] = { t: 'n', v: -arr[i].v };
  } else if (r < 0.65) {
    // Swap: exchanges two numbers — changes relative proportions and timings
    if (refs.length >= 2) {
      const i1 = Math.floor(Math.random() * refs.length);
      let i2 = Math.floor(Math.random() * refs.length);
      while (i2 === i1) i2 = Math.floor(Math.random() * refs.length);
      const tmp = refs[i1].arr[refs[i1].i].v;
      refs[i1].arr[refs[i1].i].v = refs[i2].arr[refs[i2].i].v;
      refs[i2].arr[refs[i2].i].v = tmp;
    }
  } else if (r < 0.80) {
    // Wild replacement: injects a fully random number (0–360 range, good for hues/angles)
    const { arr, i } = refs[Math.floor(Math.random() * refs.length)];
    arr[i] = { t: 'n', v: (Math.random() - 0.5) * 360 };
  } else {
    // Large jitter: big additive shift — breaks symmetry dramatically
    const { arr, i } = refs[Math.floor(Math.random() * refs.length)];
    arr[i] = { t: 'n', v: arr[i].v + (Math.random() - 0.5) * 120 };
  }
  return t;
}

// ─── Seeds ────────────────────────────────────────────────────────────────────
// 9 hand-written Forth programs that serve as the starting gene pool.
// Deliberately varied so crossover and mutation have rich raw material:
//   single-color (fixed hue)  →  two-color alternating  →  full rainbow cycling
//   filled shapes  →  stroked outlines  →  lines
//   long trails (low bg-a)    →  fast fades (high bg-a)
//   single loop  →  multi-loop compositions
// Six are chosen at random on each page load (Fisher-Yates shuffle in init).

const SEEDS = [
  // 0: warm single-color orbit (orange, medium trail)
  `0 0 0 0.2 bg-a
25 80 55 hsl
12 times {
  i twopi * 12 / frame 0.03 * +
  dup sin 100 * cx + swap cos 100 * cy +
  frame 0.06 * sin 9 * 13 + circle
}`,

  // 1: cool single-color wave lines (cyan, long trail)
  `0 0 0 0.05 bg-a
1.5 lw
185 85 55 hsl
20 times {
  0
  i height * 20 /
  width
  i height * 20 / frame 0.04 * i 0.5 * + sin 45 * +
  line
}`,

  // 2: white/gray expanding rings (grayscale, fast fade, geometric)
  `0 0 0 0.22 bg-a
1.5 lw
0 0 80 hsl
7 times {
  cx cy
  frame 4 * i 38 * + 210 mod
  ocircle
}`,

  // 3: two-color alternating sparks (orange-red vs cyan, very long trail)
  `0 0 0 0.04 bg-a
40 times {
  i 137 * frame + 512 mod width * 512 /
  i 97 * frame 2 * + 512 mod height * 512 /
  i 2 mod 155 * 20 + 85 60 hsl
  frame 0.09 * i + sin 3 * 5 + circle
}`,

  // 4: full-rainbow spiral (hue cycles per dot — good hybrid seed)
  `0 0 0 0.1 bg-a
50 times {
  i twopi * 50 / 3 * frame 0.015 * +
  dup sin i 3 * * cx +
  swap cos i 3 * * cy +
  i 7 * frame + 360 mod 80 55 hsl
  3 circle
}`,

  // 5: two-loop composition — dim rings behind, colored dots in front
  `0 0 0 0.15 bg-a
1.5 lw
0 0 30 hsl
5 times {
  cx cy frame 5 * i 48 * + 225 mod ocircle
}
210 85 58 hsl
16 times {
  i twopi * 16 / frame 0.02 * +
  dup sin 75 * cx + swap cos 75 * cy +
  frame 0.04 * sin 5 * 7 + circle
}`,

  // 6: rect equalizer — 8 vertical bars bouncing (two-tone)
  `0 0 0 0.25 bg-a
8 times {
  i width * 8 /
  frame 0.02 * i 0.8 * + sin height * 3 / height 4 / +
  width 8 /
  height 2 /
  i 2 mod 155 * 270 + frame 0.4 * + 360 mod 70 45 hsl
  rect
}`,

  // 7: tight grid of tiny dots, hue ripple (dense, minimal)
  `0 0 0 0.08 bg-a
100 times {
  i 10 mod width * 10 / width 20 / +
  i 10 / floor height * 10 / height 20 / +
  i 10 mod i 10 / floor + 25 * frame 0.5 * + 360 mod 80 55 hsl
  frame 0.04 * i + sin 3 * 5 + circle
}`,

  // 8: single fat line sweep (monochrome, high contrast, fast)
  `0 0 0 0.35 bg-a
0 0 95 hsl
3 lw
15 times {
  0
  frame 0.05 * i 0.7 * + sin height * height 2 / +
  width
  frame 0.05 * i 0.7 * + cos height * height 2 / +
  line
}`,
];

// ─── App globals ──────────────────────────────────────────────────────────────
// Canvas is 240×240 internally, displayed at 144×144 via CSS (the programs were
// designed for 240×240, so we render at that resolution and scale down in CSS).
const CANVAS_RES   = 240;
const CANVAS_CSS   = 144;
const NODE_W       = 148;   // div width (canvas 144 + 2px margin each side)
const NODE_HEADER  = 22;    // header height in px
const NODE_APPROX_H = NODE_HEADER + CANVAS_CSS + 62;  // ≈ 228
const RENDER_FRAMES = 100;  // frames accumulated per static render

// Each node object stored in the Map:
//   id          — unique integer
//   x, y        — position in workspace pixels
//   toks        — token array (the program / "DNA")
//   src         — Forth source string (for display)
//   parentIds   — array of 0, 1, or 2 parent IDs (used to draw edges)
//   frameOffset — random start frame so sibling static renders look different
//   isGenerated — true if created by GENERATE (gets a teal border)
//   isAnim      — true if this is a live animation node
//   animFrameId — requestAnimationFrame handle (null for static nodes)
//   animFrame   — current frame counter for anim nodes
//   div, canvas, ctx — DOM references
const nodes = new Map();
let nodeIdCounter = 0;
let sel = [null, null];     // [p1Id, p2Id]  — at most two nodes selected at once
let dragState = null;

// ─── Edge rendering ───────────────────────────────────────────────────────────
// Redraws all parent→child edges on the SVG overlay each time a node moves.
// Each edge is an S-curve cubic bezier with horizontal tangents at both ends
// (control points share the x of their endpoint, y at the midpoint).
// P1 parent edge = dim orange (#2e1206), P2 parent edge = dim blue (#06162e).
// Anim-node edges are dashed to show the live connection.
// A small filled dot at the child end indicates direction.

function nodeEdgePoint(node) {
  return {
    x: node.x + NODE_W / 2,
    y: node.y + NODE_HEADER + CANVAS_CSS / 2,
  };
}

function redrawEdges() {
  const svg = document.getElementById('edges');
  svg.innerHTML = '';

  for (const [, node] of nodes) {
    const nc = nodeEdgePoint(node);
    for (let pi = 0; pi < node.parentIds.length; pi++) {
      const parent = nodes.get(node.parentIds[pi]);
      if (!parent) continue;
      const pc = nodeEdgePoint(parent);

      // S-curve bezier: horizontal tangents at both ends
      const midY = (pc.y + nc.y) / 2;
      const d = `M ${pc.x} ${pc.y} C ${pc.x} ${midY} ${nc.x} ${midY} ${nc.x} ${nc.y}`;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      if (node.isAnim) {
        path.setAttribute('stroke', '#1a4a1a');
        path.setAttribute('stroke-dasharray', '4 4');
      } else {
        path.setAttribute('stroke', pi === 0 ? '#2e1206' : '#06162e');
      }
      path.setAttribute('stroke-width', '1.5');
      path.setAttribute('fill', 'none');
      svg.appendChild(path);

      // Small dot at child end to show direction
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', nc.x); dot.setAttribute('cy', nc.y); dot.setAttribute('r', '3');
      dot.setAttribute('fill', node.isAnim ? '#1a4a1a' : (pi === 0 ? '#2e1206' : '#06162e'));
      svg.appendChild(dot);
    }
  }
}

// ─── Rendering ────────────────────────────────────────────────────────────────
// Static render: fills the canvas black, then runs the program RENDER_FRAMES
// times in sequence. Because most programs use `bg-a` (fill-with-alpha) each
// frame, the frames accumulate a trail effect on the canvas — the result looks
// rich even though it's a still image.
// Each node has a random frameOffset so sibling nodes don't all start at
// frame 0 and end up looking identical for time-invariant programs.

function renderNode(node) {
  const ctx = node.ctx;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CANVAS_RES, CANVAS_RES);
  const f0 = node.frameOffset;
  for (let f = f0; f < f0 + RENDER_FRAMES; f++) {
    try {
      ctx.save();
      run(node.toks, ctx, CANVAS_RES, CANVAS_RES, f);
      ctx.restore();
    } catch (_) {}
  }
}

// ─── Node creation ────────────────────────────────────────────────────────────
// Builds the DOM element, creates the node object, renders it, and registers it.
// `addNode` is the single entry point for all node types (seeds, bred, generated).
// `createAnimNode` is a separate path for live animation nodes (see below).

function addNode(toks, parentIds, x, y, isGenerated) {
  const id = nodeIdCounter++;
  const src = toksToStr(toks);

  // Header: #id  [p1+p2] or * for generated root
  const lineage = parentIds.length ? `[${parentIds.join('+')}]` : (isGenerated ? '✦' : 'seed');

  const div = document.createElement('div');
  div.className = 'node' + (isGenerated ? ' generated' : '');
  div.style.left = x + 'px';
  div.style.top = y + 'px';

  const header = document.createElement('div');
  header.className = 'node-header';
  header.innerHTML = `<span>#${id} <span style="opacity:0.5">${lineage}</span></span><span class="node-tag"></span>`;

  const canvas = document.createElement('canvas');
  canvas.width = CANVAS_RES; canvas.height = CANVAS_RES;

  const codeEl = document.createElement('div');
  codeEl.className = 'node-code';
  codeEl.textContent = src.trim();

  div.append(header, canvas, codeEl);
  div.addEventListener('mousedown', e => { e.preventDefault(); onNodeMousedown(e, id); });
  document.getElementById('node-layer').appendChild(div);

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CANVAS_RES, CANVAS_RES);

  const node = {
    id, x, y, toks, src,
    parentIds: parentIds || [],
    frameOffset: Math.floor(Math.random() * 500),
    isGenerated,
    div, canvas, ctx,
  };
  nodes.set(id, node);
  renderNode(node);
  redrawEdges();
  return node;
}

// ─── Interaction ──────────────────────────────────────────────────────────────
// Drag vs click: mousedown records start position; if the mouse moves >4px
// before mouseup it's a drag (moves the node), otherwise it's a click (selects).
// getWsPos converts viewport coords to workspace coords, accounting for scroll.

function getWsPos(e) {
  const ws = document.getElementById('workspace');
  const r = ws.getBoundingClientRect();
  return { x: e.clientX - r.left + ws.scrollLeft, y: e.clientY - r.top + ws.scrollTop };
}

function onNodeMousedown(e, id) {
  const node = nodes.get(id);
  const pos = getWsPos(e);
  dragState = { id, startX: pos.x, startY: pos.y, origX: node.x, origY: node.y, moved: false };
}

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  const pos = getWsPos(e);
  const dx = pos.x - dragState.startX, dy = pos.y - dragState.startY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragState.moved = true;
  const node = nodes.get(dragState.id);
  node.x = dragState.origX + dx;
  node.y = dragState.origY + dy;
  node.div.style.left = node.x + 'px';
  node.div.style.top = node.y + 'px';
  redrawEdges();
});

document.addEventListener('mouseup', () => {
  if (!dragState) return;
  if (!dragState.moved) selectNode(dragState.id);
  dragState = null;
});

// Selection cycles through three states per click:
//   empty      → clicking a node makes it P1
//   P1 set     → clicking a different node makes it P2 (P1 unchanged)
//   P1+P2 set  → clicking a third node shifts: old P2 becomes P1, clicked becomes P2
//   clicking an already-selected node deselects it
function selectNode(id) {
  // Clear current selection styles
  for (const [, n] of nodes) {
    n.div.classList.remove('p1', 'p2');
    n.div.querySelector('.node-tag').textContent = '';
  }

  // Compute new selection
  if (sel[0] === id)       sel[0] = null;
  else if (sel[1] === id)  sel[1] = null;
  else if (sel[0] === null) sel[0] = id;
  else if (sel[1] === null) sel[1] = id;
  else { sel[0] = sel[1]; sel[1] = id; }

  // Apply styles
  if (sel[0] !== null && nodes.has(sel[0])) {
    nodes.get(sel[0]).div.classList.add('p1');
    nodes.get(sel[0]).div.querySelector('.node-tag').textContent = 'P1';
  }
  if (sel[1] !== null && nodes.has(sel[1])) {
    nodes.get(sel[1]).div.classList.add('p2');
    nodes.get(sel[1]).div.querySelector('.node-tag').textContent = 'P2';
  }

  updateUI();
}

// Syncs button enabled states and status text to current selection.
// BREED requires both P1 and P2. ANIMATE requires only P1.
function updateUI() {
  const ready = sel[0] !== null && sel[1] !== null;
  document.getElementById('breed-btn').disabled = !ready;
  document.getElementById('anim-btn').disabled = sel[0] === null;
  const s = document.getElementById('status');
  if (!ready && sel[0] === null)
    s.textContent = 'click a node to select p1, then p2';
  else if (!ready)
    s.textContent = `p1: #${sel[0]}  —  click another node for p2`;
  else
    s.textContent = `#${sel[0]} × #${sel[1]}  →  breed`;
}

// ─── Breed ────────────────────────────────────────────────────────────────────
// crossover(P1.toks, P2.toks) → mutate → new child node placed below parents.
// After breeding, both parents deselect and the child becomes P1 automatically,
// so you can immediately click ANIMATE or select a second node to breed again.

function breed() {
  if (sel[0] === null || sel[1] === null) return;
  const p1 = nodes.get(sel[0]), p2 = nodes.get(sel[1]);
  if (!p1 || !p2) return;

  const childToks = mutate(crossover(p1.toks, p2.toks));

  // Place child below-and-between the two parents
  const cx = (p1.x + p2.x) / 2 + (Math.random() - 0.5) * 80;
  const cy = Math.max(p1.y, p2.y) + NODE_APPROX_H + 60;

  const child = addNode(childToks, [sel[0], sel[1]], cx, cy, false);

  // Deselect parents and auto-select the new child as P1 so ANIMATE works immediately
  for (const [, n] of nodes) {
    n.div.classList.remove('p1', 'p2');
    n.div.querySelector('.node-tag').textContent = '';
  }
  sel[0] = child.id; sel[1] = null;
  child.div.classList.add('p1');
  child.div.querySelector('.node-tag').textContent = 'P1';
}

// ─── Delete ───────────────────────────────────────────────────────────────────
// Removes a node from the Map and DOM, cancels any live RAF loop (anim nodes),
// orphans its children (they keep their other parent edge), and redraws.

function deleteNode(id) {
  const node = nodes.get(id);
  if (!node) return;
  if (node.animFrameId) cancelAnimationFrame(node.animFrameId);
  // Orphan any children that referenced this node as a parent
  for (const [, n] of nodes) {
    n.parentIds = n.parentIds.filter(pid => pid !== id);
  }
  node.div.remove();
  nodes.delete(id);
  if (sel[0] === id) sel[0] = null;
  if (sel[1] === id) sel[1] = null;
  // Re-apply selection styles (in case the other selected node lost its highlight)
  for (const [, n] of nodes) {
    n.div.classList.remove('p1', 'p2');
    n.div.querySelector('.node-tag').textContent = '';
  }
  if (sel[0] !== null && nodes.has(sel[0])) {
    nodes.get(sel[0]).div.classList.add('p1');
    nodes.get(sel[0]).div.querySelector('.node-tag').textContent = 'P1';
  }
  if (sel[1] !== null && nodes.has(sel[1])) {
    nodes.get(sel[1]).div.classList.add('p2');
    nodes.get(sel[1]).div.querySelector('.node-tag').textContent = 'P2';
  }
  redrawEdges();
  updateUI();
}

// ─── Animate ──────────────────────────────────────────────────────────────────

function createAnimNode(parentId) {
  const parent = nodes.get(parentId);
  if (!parent) return;

  const toks = JSON.parse(JSON.stringify(parent.toks));
  const id = nodeIdCounter++;
  const x = parent.x + NODE_W + 30;
  const y = parent.y;

  const div = document.createElement('div');
  div.className = 'node anim';
  div.style.left = x + 'px';
  div.style.top = y + 'px';

  const header = document.createElement('div');
  header.className = 'node-header';
  header.innerHTML = `<span>#${id} <span style="opacity:0.5">▶ live</span></span><span class="node-tag"></span>`;

  const canvas = document.createElement('canvas');
  canvas.width = CANVAS_RES; canvas.height = CANVAS_RES;

  const codeEl = document.createElement('div');
  codeEl.className = 'node-code';
  codeEl.textContent = toksToStr(toks).trim();

  div.append(header, canvas, codeEl);
  div.addEventListener('mousedown', e => { e.preventDefault(); onNodeMousedown(e, id); });
  document.getElementById('node-layer').appendChild(div);

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CANVAS_RES, CANVAS_RES);

  // Pre-roll canvas to match the parent's static snapshot so the animation
  // starts from the same visual state rather than from a blank frame 0.
  const f0 = parent.frameOffset;
  for (let f = f0; f < f0 + RENDER_FRAMES; f++) {
    try { ctx.save(); run(toks, ctx, CANVAS_RES, CANVAS_RES, f); ctx.restore(); } catch (_) {}
  }

  const node = {
    id, x, y, toks, src: toksToStr(toks),
    parentIds: [parentId],
    frameOffset: f0,
    isGenerated: false,
    isAnim: true,
    div, canvas, ctx,
    animFrameId: null,
    animFrame: f0 + RENDER_FRAMES,
  };
  nodes.set(id, node);

  function tick() {
    node.animFrameId = requestAnimationFrame(tick);
    node.animFrame++;
    try {
      ctx.save();
      run(toks, ctx, CANVAS_RES, CANVAS_RES, node.animFrame);
      ctx.restore();
    } catch (_) {}
  }
  node.animFrameId = requestAnimationFrame(tick);

  redrawEdges();
  return node;
}

// ─── Generate ─────────────────────────────────────────────────────────────────
// Adds 3 new nodes to the right of the current graph.
// Each node is independently either:
//   50% — a single seed mutated 2–4 times (preserves one visual style, varied)
//   50% — crossover of two random seeds then mutated once (unpredictable hybrid)
// Generated nodes get a teal border to distinguish them from bred children.

function generate() {
  const all = Array.from(nodes.values());
  const rightEdge = all.length ? Math.max(...all.map(n => n.x + NODE_W)) + 50 : 80;
  const midY = all.length ? all.reduce((s, n) => s + n.y, 0) / all.length : 250;

  for (let i = 0; i < 3; i++) {
    let toks;
    if (Math.random() < 0.5) {
      // Mutated single seed
      let base = tokenize(SEEDS[Math.floor(Math.random() * SEEDS.length)]);
      const mCount = 2 + Math.floor(Math.random() * 3);
      for (let m = 0; m < mCount; m++) base = mutate(base);
      toks = base;
    } else {
      // Crossover of two different random seeds — more surprising starting points
      const a = tokenize(SEEDS[Math.floor(Math.random() * SEEDS.length)]);
      const b = tokenize(SEEDS[Math.floor(Math.random() * SEEDS.length)]);
      toks = mutate(crossover(a, b));
    }
    const x = rightEdge;
    const y = midY + (i - 1) * (NODE_APPROX_H + 24) + (Math.random() - 0.5) * 20;
    addNode(toks, [], x, y, true);
  }
}

// ─── Reset ────────────────────────────────────────────────────────────────────

function reset() {
  for (const [, n] of nodes) if (n.animFrameId) cancelAnimationFrame(n.animFrameId);
  nodes.clear();
  nodeIdCounter = 0;
  sel = [null, null];
  document.getElementById('node-layer').innerHTML = '';
  document.getElementById('edges').innerHTML = '';
  init();
}

// ─── Init ─────────────────────────────────────────────────────────────────────

// 6 seed nodes in a 3×2 grid
const INIT_POS = [
  [80,  80], [278, 80], [476, 80],
  [80, 360], [278, 360], [476, 360],
];

function init() {
  // Pick 6 distinct seeds at random from the full pool
  const indices = Array.from({ length: SEEDS.length }, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  for (let i = 0; i < 6; i++) {
    const [x, y] = INIT_POS[i];
    addNode(tokenize(SEEDS[indices[i]]), [], x, y, false);
  }
  updateUI();
}

// ─── Event wiring ─────────────────────────────────────────────────────────────
document.getElementById('breed-btn').addEventListener('click', () => { breed(); updateUI(); });
document.getElementById('anim-btn').addEventListener('click', () => { if (sel[0] !== null) createAnimNode(sel[0]); });
document.getElementById('gen-btn').addEventListener('click', generate);
document.getElementById('reset-btn').addEventListener('click', reset);

// Delete / Backspace removes the selected node (P1 first, then P2)
document.addEventListener('keydown', e => {
  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const toDelete = sel[0] !== null ? sel[0] : sel[1] !== null ? sel[1] : null;
  if (toDelete !== null) { e.preventDefault(); deleteNode(toDelete); }
});

init();
</script>
</body>
</html>
